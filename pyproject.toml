[project]
name = "gpu-and-vision-benchmarks"
version = "0.1.0"
description = "GPU stress tests and vision model pipeline (ViT, BLIP, CLIP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.12.1",
    "Pillow>=12.2.0",
    "matplotlib>=3.9.0",
    "numpy>=2.4.6",
    "requests>=2.34.2",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
benchmark = [
    "tensorflow>=2.21.0",
]
